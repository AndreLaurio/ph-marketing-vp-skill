schema_version: "1.1"
name: skincare-shop-giveaway
expected_outcome: |
  The roadmap for a Shopee skincare seller flags FDA notification for cosmetics and that a
  social media giveaway with prizes generally needs a DTI (or FDA for cosmetics) sales
  promotion permit applied at least 30 days ahead, and suggests compliant alternatives
  (bundles, freebies with purchase). It uses TikTok/TikTok Shop or Shopee with nano
  creators and double-day sales (e.g. 11.11, 12.12) from the calendar.
